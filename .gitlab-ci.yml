# =============================================================================
# Harfino — GitLab CI/CD Pipeline
# -----------------------------------------------------------------------------
# Stages:
#   quality   - lint, typecheck, formatting
#   test      - unit & integration tests (DB-backed)
#   security  - dependency audit, SAST (Semgrep), secret scanning (Gitleaks)
#   e2e       - end-to-end tests (Playwright, real browser)
#   build     - production build of all workspaces
#   db        - generate (and optionally migrate) database migrations
#
# Design notes:
#   * `npm ci` is cached via package-lock.json so installs are fast & hermetic.
#   * Tests run against disposable Postgres/Valkey service containers.
#   * The `build` gate only runs after quality + test + security + e2e pass.
#   * Pipeline is scoped to merge requests + default branch (see `workflow`).
# =============================================================================

stages:
  - quality
  - test
  - security
  - e2e
  - build
  - db

# -----------------------------------------------------------------------------
# Global defaults
# -----------------------------------------------------------------------------
variables:
  NODE_VERSION: "20"
  NPM_CONFIG_CACHE: "${CI_PROJECT_DIR}/.npm-cache"
  PLAYWRIGHT_BROWSERS_PATH: "${CI_PROJECT_DIR}/.cache/ms-playwright"
  TURBO_TELEMETRY_DISABLED: "1"
  # Keep Turbo's local cache out of the way; rely on CI artifact caching.
  TURBO_CACHE_DIR: "${CI_PROJECT_DIR}/.turbo-cache"
  # Database / cache service credentials used by test & e2e stages.
  POSTGRES_USER: "herafino"
  POSTGRES_PASSWORD: "herafino"
  POSTGRES_DB: "herafino"
  DATABASE_URL: "postgres://herafino:herafino@postgres:5432/herafino"
  VALKEY_URL: "redis://valkey:6379"

workflow:
  # Only run pipelines for merge requests, the default branch, tags, and
  # manually-triggered runs. Avoids redundant detached pipelines on every push.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"

default:
  image: "node:${NODE_VERSION}"
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stale_schedule
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm-cache/
      - node_modules/
      - .turbo-cache/
    policy: pull-push

# -----------------------------------------------------------------------------
# Reusable anchors
# -----------------------------------------------------------------------------
.install: &install
  - npm ci --prefer-offline --no-audit --no-fund

.services_db: &services_db
  services:
    - name: postgres:16-alpine
      alias: postgres
      variables:
        POSTGRES_USER: "${POSTGRES_USER}"
        POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
        POSTGRES_DB: "${POSTGRES_DB}"
    - name: valkey/valkey:8.0.0
      alias: valkey

# -----------------------------------------------------------------------------
# Quality
# -----------------------------------------------------------------------------
lint:
  stage: quality
  script:
    - *install
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

format:
  stage: quality
  script:
    - *install
    - npx prettier --check "**/*.{ts,tsx,js,jsx,json,md,yml,yaml}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

typecheck:
  stage: quality
  script:
    - *install
    - npm run typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# -----------------------------------------------------------------------------
# Tests
# -----------------------------------------------------------------------------
unit-test:
  stage: test
  script:
    - *install
    - npx turbo run build --filter=!@herafino/web
    - npm run test:unit
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)/'
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

integration-test:
  stage: test
  <<: *services_db
  variables:
    NODE_ENV: "test"
    RUN_INTEGRATION: "1"
    # Override to match the service container hostnames.
    DATABASE_URL: "postgres://herafino:herafino@postgres:5432/herafino"
    VALKEY_URL: "redis://valkey:6379"
  script:
    - *install
    - npx turbo run build
    - npx drizzle-kit migrate --config packages/shared/drizzle.config.json
    - npm run test:integration
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - coverage/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# -----------------------------------------------------------------------------
# Security
# -----------------------------------------------------------------------------
security:
  stage: security
  variables:
    SEMGREP_APP_TOKEN: "$SEMGREP_APP_TOKEN"
    GITLEAKS_LICENSE: "$GITLEAKS_LICENSE"
    SEMGREP_CACHE_DIR: "${CI_PROJECT_DIR}/.semgrep-cache"
  cache:
    key: security-tools
    paths:
      - .semgrep-cache/
      - .gitleaks-bin/
    policy: pull-push
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    - npm install -g semgrep@latest
    - |
      if [ ! -x "${CI_PROJECT_DIR}/.gitleaks-bin/gitleaks" ]; then
        curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
        mkdir -p "${CI_PROJECT_DIR}/.gitleaks-bin"
        tar -xzf /tmp/gitleaks.tar.gz -C "${CI_PROJECT_DIR}/.gitleaks-bin" gitleaks
      fi
  script:
    - *install
    - npm audit --audit-level=high
    - semgrep ci --config p/default
    - "${CI_PROJECT_DIR}/.gitleaks-bin/gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# -----------------------------------------------------------------------------
# End-to-end
# -----------------------------------------------------------------------------
e2e:
  stage: e2e
  needs:
    - lint
    - typecheck
  <<: *services_db
  variables:
    DATABASE_URL: "postgres://herafino:herafino@postgres:5432/herafino"
    VALKEY_URL: "redis://valkey:6379"
    NEXTAUTH_SECRET: "ci-e2e-secret"
    NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    NEXT_PUBLIC_WS_URL: "ws://localhost:3001"
    NODE_ENV: "test"
  script:
    - *install
    - npx playwright install --with-deps chromium
    - npx drizzle-kit migrate --config packages/shared/drizzle.config.json
    - npx playwright test
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - playwright-report/
      - test-results/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# -----------------------------------------------------------------------------
# Build (production gate)
# -----------------------------------------------------------------------------
build:
  stage: build
  needs:
    - lint
    - typecheck
    - unit-test
    - integration-test
    - security
    - e2e
  script:
    - *install
    - npx turbo run build
  artifacts:
    when: on_success
    expire_in: 7 days
    paths:
      - apps/web/.next/
      - apps/web/dist/
      - packages/*/dist/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# -----------------------------------------------------------------------------
# Database migrations
# -----------------------------------------------------------------------------
db-generate:
  stage: db
  script:
    - *install
    - npx turbo run db:generate
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual

db-migrate:
  stage: db
  <<: *services_db
  variables:
    DATABASE_URL: "postgres://herafino:herafino@postgres:5432/herafino"
  script:
    - *install
    - npx drizzle-kit migrate --config packages/shared/drizzle.config.json
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
