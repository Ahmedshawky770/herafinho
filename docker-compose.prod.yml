services:
  postgres:
    image: postgres:16-alpine
    container_name: harfino_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: herafino_prod
      POSTGRES_USER: ${POSTGRES_USER:-herafino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - harfino_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-herafino}"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8.0.0
    container_name: harfino_valkey
    restart: unless-stopped
    command: valkey-server --appendonly yes --save 30 1
    volumes:
      - valkey_data:/data
    networks:
      - harfino_network
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: harfino_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-herafino}:${POSTGRES_PASSWORD}@postgres:5432/herafino_prod
      DIRECT_URL: postgres://${POSTGRES_USER:-herafino}:${POSTGRES_PASSWORD}@postgres:5432/herafino_prod
      VALKEY_URL: valkey://valkey:6379
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - harfino_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  ws:
    build:
      context: .
      dockerfile: Dockerfile.ws
    container_name: harfino_ws
    restart: unless-stopped
    ports:
      - "3001:3001"
    command: npm run ws
    environment:
      NODE_ENV: production
      WS_PORT: "3001"
      DATABASE_URL: postgres://${POSTGRES_USER:-herafino}:${POSTGRES_PASSWORD}@postgres:5432/herafino_prod
      DIRECT_URL: postgres://${POSTGRES_USER:-herafino}:${POSTGRES_PASSWORD}@postgres:5432/herafino_prod
      VALKEY_URL: valkey://valkey:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_ID: ws-1
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - harfino_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: harfino_worker
    restart: unless-stopped
    command: npm run worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-herafino}:${POSTGRES_PASSWORD}@postgres:5432/herafino_prod
      DIRECT_URL: postgres://${POSTGRES_USER:-herafino}:${POSTGRES_PASSWORD}@postgres:5432/herafino_prod
      VALKEY_URL: valkey://valkey:6379
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SENTRY_DSN: ${SENTRY_DSN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_ID: worker-1
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - harfino_network

volumes:
  postgres_data:
    driver: local
  valkey_data:
    driver: local

networks:
  harfino_network:
    driver: bridge
